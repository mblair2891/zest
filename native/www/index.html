<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F7F6F3" />
    <title>Summex</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #F7F6F3;
        color: #0A0A0A;
        font-family: Inter, Helvetica Neue, system-ui, sans-serif;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 1.5rem;
      }
      .mark {
        width: 3rem;
        height: 3rem;
        margin: 0 auto 1rem;
      }
      .word {
        letter-spacing: 0.28em;
        font-weight: 600;
        font-size: 0.85rem;
      }
      p {
        opacity: 0.75;
        max-width: 22rem;
        line-height: 1.45;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div>
      <svg class="mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="4" width="24" height="24" rx="2" stroke="#0A0A0A" stroke-width="1.5"/>
        <path d="M11 11h10v3.25H15.75v1.5H21v3.25H11v-3.25h5.25v-1.5H11z" fill="#0A0A0A"/>
      </svg>
      <p class="word">SUMMEX</p>
      <p>
        Staff kiosk. Loads <code>https://summex.app/?station=…</code>
        (PIN pad). Guest QR stays in the browser.
      </p>
    </div>
  </body>
</html>
