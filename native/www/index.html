<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0c0b" />
    <title>Summex</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0a0c0b;
        color: #eef5f0;
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 1.5rem;
      }
      .z {
        width: 4rem;
        height: 4rem;
        border-radius: 1rem;
        background: #c8f542;
        color: #0f1608;
        font-weight: 900;
        font-size: 1.75rem;
        display: grid;
        place-items: center;
        margin: 0 auto 1rem;
      }
      p {
        opacity: 0.75;
        max-width: 22rem;
        line-height: 1.45;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="z">Z</div>
      <p>
        Summex native shell. When configured, this WebView loads your live POS URL
        (see <code>native/summex-native.json</code>).
      </p>
    </div>
  </body>
</html>
